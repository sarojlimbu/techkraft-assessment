<div class="input-wrapper">
  <mat-form-field [appearance]="appearance" class="custom-input-field">
    @if (label) {
      <mat-label>{{ displayLabel }}</mat-label>
    }

    @if (icon) {
      <mat-icon matPrefix>{{ icon }}</mat-icon>
    }

    <input
      matInput
      [type]="type"
      [placeholder]="showPlaceholder ? placeholder : ''"
      [value]="value"
      [disabled]="disabled"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (input)="onInput($event)"
    />
  </mat-form-field>

  @if (shouldShowError) {
    <div class="input-error">{{ resolvedErrorText }}</div>
  }
</div>
