<div class="table-shell">
  <div class="table-wrap">
    <div class="table-card">
      <table mat-table [dataSource]="dataSource" class="custom-mat-table">
        @for (column of columns; track column.key) {
          <ng-container [matColumnDef]="column.key">
            <th
              mat-header-cell
              *matHeaderCellDef
              [class.sticky-actions-column]="isActionsColumn(column) && hasActionsColumn()"
              [style.width]="getColumnWidth(column)"
              [style.minWidth]="getColumnWidth(column)"
              [style.maxWidth]="getColumnWidth(column)"
            >
              {{ column.label }}
            </th>

            <td
              mat-cell
              *matCellDef="let element"
              [class.sticky-actions-column]="isActionsColumn(column) && hasActionsColumn()"
              [style.width]="getColumnWidth(column)"
              [style.minWidth]="getColumnWidth(column)"
              [style.maxWidth]="getColumnWidth(column)"
            >
              @if (isActionsColumn(column)) {
                <div class="action-buttons">
                  @for (action of getColumnActions(column); track action.key) {
                    <ng-container
                      [ngTemplateOutlet]="action.template"
                      [ngTemplateOutletContext]="{ $implicit: element }"
                    ></ng-container>
                  }
                </div>
              }
              {{ getCellValue(element, column.key) }}
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>

  <app-paginator
    class="table-paginator"
    [pageSizeOptions]="[5, 10, 20]"
    [pageSize]="5"
    [showFirstLastButtons]="true"
    ariaLabel="Select page of merchant records"
  ></app-paginator>
</div>
