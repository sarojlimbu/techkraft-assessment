<div class="dashboard-shell">
  <main class="dashboard-main">
    <section class="page-header">
      <h1>Application Dashboard</h1>

      <div class="header-actions">
        <app-button label="Refresh Data" variant="text" buttonClass="ghost-btn" (buttonClick)="loadApplications()"></app-button>
        <app-button
          label="Create Merchant App"
          variant="filled"
          buttonClass="primary-btn"
          (buttonClick)="createApplication()"
        ></app-button>
      </div>
    </section>

    <section class="stats-grid" aria-label="Dashboard metrics">
      @for (stat of stats; track stat.label) {
        <app-card>
          <div class="stat-card" [class.warning-card]="stat.warning">
            <div class="stat-icon" [ngClass]="stat.iconClass">{{ stat.warning ? '!' : '◫' }}</div>
            <div class="stat-value">{{ stat.value }}</div>
            <div class="stat-label">{{ stat.label }}</div>
          </div>
        </app-card>
      }
    </section>

    <section class="filter-toolbar" aria-label="Filters">
      <app-input
        class="search-field"
        placeholder="Search business name, merchant ID, email..."
        icon="search"
        [value]="searchText"
        (valueChange)="searchText = $event"
      ></app-input>

      <app-select
        class="material-filter"
        label="All Statuses"
        [options]="statusOptions"
        [value]="selectedStatus"
        (valueChange)="selectedStatus = $event"
      ></app-select>

      <app-select
        class="material-filter"
        label="All Risk Levels"
        [options]="riskOptions"
        [value]="selectedRisk"
        (valueChange)="selectedRisk = $event"
      ></app-select>

      <app-button label="Reset Filters" variant="text" buttonClass="filter-btn" (buttonClick)="resetFilters()"></app-button>
    </section>

    <section class="table-panel">
      <ng-template #viewAction let-row>
        <app-button
          [label]="row['status'] === 'DRAFT' ? 'Edit' : 'View'"
          variant="text"
          buttonClass="table-action-btn view-action"
          (buttonClick)="handleView(row)"
        ></app-button>
      </ng-template>

      @if (loading) {
        <div class="dashboard-state" role="status" aria-live="polite">Loading applications…</div>
      } @else if (errorMessage) {
        <div class="dashboard-state dashboard-error" role="alert">
          <p>{{ errorMessage }}</p>
          <app-button label="Retry" variant="outlined" (buttonClick)="loadApplications()"></app-button>
        </div>
      } @else {
        <app-table
          [columns]="tableColumns"
          [data]="filteredTableData"
        ></app-table>
      }
    </section>
  </main>
</div>
